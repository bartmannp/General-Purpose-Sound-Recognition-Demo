# Example override-focused config.
# Only include the keys you want to change.
# Missing keys keep defaults from sed_demo.__main__.ConfDef.

HEADLESS: true
TOP_K: 10
INFERENCE_INTERVAL: 0.35
HEADLESS_PRINT_INTERVAL: 1.5
HEADLESS_MIN_CONFIDENCE: 0.2
HEADLESS_LOG_PATH: logs/sound-recognition_$timestamp.log
SELECT_AUDIO_DEVICE: true

# Optional sensitivity multipliers (1.0 is neutral).
LABEL_GAINS:
	"Walk, footsteps": 1.2
	"Toilet flush": 0.8
COLLECTION_GAINS:
	"door bell": 1.3
	"boiling water": 0.9
