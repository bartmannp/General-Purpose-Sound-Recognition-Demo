[project]
name = "general-purpose-sound-recognition-demo"
version = "0.0.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "librosa>=0.10.2,<0.11",
    "numpy>=1.26,<3",
    "omegaconf>=2.3.0",
    "pillow>=10.0,<12",
    "pyaudio>=0.2.14",
    "soundfile>=0.12.1,<0.14",
    "torch>=2.3,<2.6",
    "torchlibrosa>=0.1,<0.2",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sed_demo*"]
