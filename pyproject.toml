[project]
name = "general-purpose-sound-recognition-demo"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "librosa>=0.11.0",
    "numpy>=2.4.6",
    "omegaconf>=2.3.0",
    "pillow>=12.2.0",
    "pyaudio>=0.2.14",
    "torch>=2.12.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sed_demo*"]
